name: Deploy AI014 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * 1-5" # Weekdays, after ECB daily publication; UTC
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://ai014.com' }}
      BASE_PATH: ${{ vars.BASE_PATH || '/' }}
    steps:
      - uses: actions/checkout@v7
      - name: Restore last verified reference snapshot
        id: reference-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            src/data/trends.json
            docs/trends-source-checksums.json
          key: reference-v1-${{ hashFiles('scripts/import-trends.py', 'src/data/trends.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: reference-v1-${{ hashFiles('scripts/import-trends.py', 'src/data/trends.json') }}-
          fail-on-cache-miss: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v6
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          python-version: "3.12"
      - name: Refresh official reference sources
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install openpyxl==3.1.5
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/refresh-trends.py
      - name: Preserve downloaded source evidence
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: official-trends-sources
          path: .trends-sources/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Cache verified snapshot without repository write access
        uses: actions/cache/save@v5
        with:
          path: |
            src/data/trends.json
            docs/trends-source-checksums.json
          key: ${{ steps.reference-cache.outputs.cache-primary-key }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
